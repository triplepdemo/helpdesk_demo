<script>
    const params = new URLSearchParams(window.location.search);
    const phone = params.get("phone") || "Onbekend";
    const klant = params.get("klant") || "Onbekend";
    const keuze = params.get("keuze"); // NIEUW

    // Toon klantnummer
    document.getElementById("klant").textContent = klant;

    // Maak telefoonnummer klikbaar als tel-link
    const phoneSpan = document.getElementById("phone");
    if (phone !== "Onbekend") {
        const link = document.createElement("a");
        link.href = `tel:+${phone}`;
        link.textContent = `+${phone}`;
        link.className = "tel-link";
        phoneSpan.textContent = "";
        phoneSpan.appendChild(link);
    } else {
        phoneSpan.textContent = phone;
    }

    // 🔥 NIEUWE LOGICA VOOR KEUZE A/B/C
    if (keuze) {
        const container = document.querySelector(".container");

        let melding = "";

        switch (keuze.toUpperCase()) {
            case "A":
                melding = "Klant heeft gekozen voor: Betalingsregeling";
                container.style.borderLeft = "6px solid orange";
                break;
            case "B":
                melding = "Klant heeft gekozen voor: Factuur opnieuw verzenden";
                container.style.borderLeft = "6px solid blue";
                break;
            case "C":
                melding = "Klant heeft gekozen voor: Contact met medewerker";
                container.style.borderLeft = "6px solid green";
                break;
            default:
                melding = "";
        }

        if (melding) {
            const div = document.createElement("div");
            div.className = "info";
            div.style.fontWeight = "bold";
            div.textContent = melding;

            container.appendChild(div);
        }
    }
</script>
