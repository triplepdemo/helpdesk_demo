<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Helpdesk Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.tabs {
    display: flex;
    align-items: center;
    background: #0078d4;
}

.tab {
    padding: 14px 20px;
    color: white;
    cursor: pointer;
}

.tab.active {
    background: #005a9e;
    font-weight: bold;
}

.spacer {
    flex-grow: 1;
}

.open-button {
    margin-right: 10px;
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: white;
    color: #0078d4;
    font-weight: bold;
}

iframe {
    width: 100%;
    height: calc(100vh - 50px);
    border: none;
}
</style>
</head>

<body>

<div class="tabs">
    <div class="tab active" onclick="openTab(1,this)">Helpdesk</div>
    <div class="tab" onclick="openTab(2,this)">CRM</div>

    <div class="spacer"></div>

    <button class="open-button" onclick="openInNewTab()">
        ↗ Open in nieuw tabblad
    </button>
</div>

<iframe id="contentFrame"></iframe>

<script>

// Alle parameters uit de URL meenemen
const queryString = window.location.search;

// Pagina's voor de tabs
const pages = {
    1: "index.html" + queryString,
    2: "https://app.hubspot.com/embed/12345/0-1/251/timeline"
};

function openTab(id, element) {

    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
    });

    element.classList.add('active');

    document.getElementById('contentFrame').src = pages[id];
}

function openInNewTab() {

    const currentUrl =
        document.getElementById('contentFrame').src;

    if (currentUrl) {
        window.open(currentUrl, '_blank');
    }
}

// Standaard Helpdesk openen
document.getElementById('contentFrame').src = pages[1];

</script>

</body>
</html>
