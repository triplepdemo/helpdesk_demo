<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Helpdesk Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.tabs {
    display: flex;
    align-items: center;
    background: #0078d4;
}

.tab {
    padding: 14px 20px;
    color: white;
    cursor: pointer;
}

.tab.active {
    background: #005a9e;
    font-weight: bold;
}

.spacer {
    flex-grow: 1;
}

.open-button {
    margin-right: 10px;
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: white;
    color: #0078d4;
    font-weight: bold;
}

iframe {
    width: 100%;
    height: calc(100vh - 50px);
    border: none;
}
</style>

</head>

<body>

<div class="tabs">
    <div class="tab active" onclick="openTab(1, this)">Call History</div>
    <div class="tab" onclick="openTab(2, this)">CRM</div>
    <div class="tab" onclick="openTab(3, this)">Terugbelverzoek</div>

    <div class="spacer"></div>

    <button class="open-button" onclick="openInNewTab()">
        ↗ Open in nieuw tabblad
    </button>
</div>

<iframe id="contentFrame"></iframe>

<script>

// ============================================================
// PARAMETERS VANUIT VOCA
// ============================================================

const params = new URLSearchParams(window.location.search);

let phone = params.get("phone") || "";
const klant = params.get("klant") || "";
const contactID = params.get("contactID") || "";


// ============================================================
// HISTORY URL
//
// historyUrl moet de LAATSTE parameter zijn in de Voca URL.
//
// Omdat Voca de URL niet kan encodeURIComponent()'en, lezen we
// alles na &historyUrl= rechtstreeks uit de originele querystring.
// Hierdoor blijven ?ani=, &exp= en &sig= onderdeel van historyUrl.
// ============================================================

let historyUrl = "";

const historyMarker = "&historyUrl=";
const historyPosition = window.location.search.indexOf(historyMarker);

if (historyPosition !== -1) {

    historyUrl = window.location.search.substring(
        historyPosition + historyMarker.length
    );

    // Decodeer alleen waar nodig.
    // Als de URL al bruikbaar is, blijft deze gewoon intact.
    try {
        historyUrl = decodeURIComponent(historyUrl);
    } catch (e) {
        console.log("historyUrl kon niet worden gedecodeerd, originele waarde wordt gebruikt.");
    }
}
