<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Helpdesk Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.tabs {
    display: flex;
    align-items: center;
    background: #0078d4;
}

.tab {
    padding: 14px 20px;
    color: white;
    cursor: pointer;
}

.tab.active {
    background: #005a9e;
    font-weight: bold;
}

.spacer {
    flex-grow: 1;
}

.open-button {
    margin-right: 10px;
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: white;
    color: #0078d4;
    font-weight: bold;
}

iframe {
    width: 100%;
    height: calc(100vh - 50px);
    border: none;
}
</style>

</head>
<body>

<div class="tabs">
    <div class="tab active" onclick="openTab(1,this)">Helpdesk</div>
    <div class="tab" onclick="openTab(2,this)">CRM</div>
    <div class="tab" onclick="openTab(3,this)">Terugbelverzoek</div>

    <div class="spacer"></div>

    <button class="open-button" onclick="openInNewTab()">
        ↗ Open in nieuw tabblad
    </button>
</div>

<iframe id="contentFrame"></iframe>

<script>

// Alle URL-parameters uitlezen
const queryString = window.location.search;
const params = new URLSearchParams(queryString);

const phone = params.get("phone") || "";

// Pagina's voor de tabs
const pages = {

    // Bestaande helpdesk pagina
    1: "index.html" + queryString,

    // HubSpot
    2: "https://app-eu1.hubspot.com/embed/144113300/0-1/10238801382/timeline",

    // Power App terugbelverzoek
    3: "https://apps.powerapps.com/play/e/default-b3ad26bd-8476-47a7-b26e-606968902e27/a/ae0f161c-1ae9-4bbc-9f0b-5df6b97d2766?tenantId=b3ad26bd-8476-47a7-b26e-606968902e27&hint=b4385edd-e506-4bd2-bd5b-8a549e8dbf9a&sourcetime=1777451307476&phone=" + encodeURIComponent("+" + phone)

};

function openTab(id, element) {

    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
    });

    element.classList.add('active');

    document.getElementById('contentFrame').src = pages[id];
}

function openInNewTab() {

    const currentUrl =
        document.getElementById('contentFrame').src;

    if (currentUrl) {
        window.open(currentUrl, '_blank');
    }
}

// Standaard eerste tab openen
document.getElementById('contentFrame').src = pages[1];

</script>

</body>
</html>
